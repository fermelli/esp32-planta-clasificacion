; Sketch minimo para probar el LCD I2C solo, sin WiFi/MQTT/teclado -- compila
; y sube en segundos, para iterar rapido en el ajuste de contraste.
; Usar: pio run -e esp32dev -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
