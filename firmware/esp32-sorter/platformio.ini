[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../shared
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.6
    adafruit/Adafruit TCS34725@^1.4.4

; Firmware normal: espera sincronizar ESP-NOW con el gateway antes de operar.
[env:esp32dev]

; Para probar esta placa sola (sin gateway ni WiFi): botón, motor, sensor y
; LEDs funcionan desde el arranque. `pio run -e standalone -t upload`.
[env:standalone]
build_flags = ${env.build_flags} -DMODO_STANDALONE
