; ESP32-S3-CAM (Dragon OV3660). Versión A: verificación de rostro para el login.
[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared
    -DBOARD_HAS_PSRAM
; PSRAM octal (módulos N8R8 / N16R8, lo más común en estas placas). Si al arrancar
; se reinicia en loop o dice que no hay PSRAM, probar qio_qspi (módulos N8R2/N4R2).
board_build.arduino.memory_type = qio_opi
; Serial sale por el puerto USB marcado "UART". Para verlo por el puerto USB
; nativo, agregar -DARDUINO_USB_CDC_ON_BOOT=1 a build_flags.
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
