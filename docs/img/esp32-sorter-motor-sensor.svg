<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ESP32 #2 (sorter) — cinta (L298N + motor) y sensor de color TCS3472</title>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Cinta (L298N + motor) y sensor de color TCS3472</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#555">Dos módulos independientes: el L298N necesita su propia fuente, el TCS3472 se alimenta del ESP32</text>

  <g transform="translate(0,70)">
    <!-- ESP32 -->
    <rect x="40" y="150" width="150" height="220" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="600">ESP32 #2</text>
    <text x="115" y="198" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">sorter</text>

    <!-- L298N -->
    <rect x="330" y="60" width="220" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="440" y="85" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">Driver L298N</text>

    <g font-family="sans-serif" font-size="11">
      <line x1="190" y1="180" x2="328" y2="105" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="200" y="176" fill="#334155">GPIO 25</text>
      <text x="337" y="100" fill="#991b1b">ENA (PWM)</text>

      <line x1="190" y1="210" x2="328" y2="135" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="200" y="206" fill="#334155">GPIO 26</text>
      <text x="337" y="130" fill="#991b1b">IN1</text>

      <line x1="190" y1="240" x2="328" y2="165" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="200" y="236" fill="#334155">GPIO 27</text>
      <text x="337" y="160" fill="#991b1b">IN2</text>
    </g>

    <!-- Motor -->
    <circle cx="700" cy="135" r="45" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="700" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">M</text>
    <text x="700" y="200" text-anchor="middle" font-size="11" fill="#9a3412">Motor DC + reductora (cinta)</text>
    <line x1="550" y1="115" x2="655" y2="120" stroke="#c2410c" stroke-width="2"/>
    <line x1="550" y1="155" x2="655" y2="150" stroke="#c2410c" stroke-width="2"/>
    <text x="600" y="105" text-anchor="middle" font-size="10" fill="#9a3412">OUT1/OUT2</text>

    <!-- Fuente externa para L298N -->
    <rect x="330" y="250" width="220" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="440" y="275" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">Fuente externa 6-12V</text>
    <text x="440" y="292" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="sans-serif">al VMS/12V del L298N, nunca del ESP32</text>
    <line x1="440" y1="250" x2="440" y2="210" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- GND comun L298N -->
    <line x1="190" y1="270" x2="300" y2="270" stroke="#475569" stroke-width="2"/>
    <line x1="300" y1="270" x2="300" y2="320" stroke="#475569" stroke-width="2"/>
    <line x1="300" y1="320" x2="330" y2="320" stroke="#475569" stroke-width="2"/>
    <text x="230" y="284" font-size="10.5" fill="#475569">GND común (ESP32 + L298N + fuente)</text>

    <!-- TCS3472 -->
    <rect x="330" y="400" width="220" height="130" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="440" y="425" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">Sensor TCS3472</text>
    <text x="440" y="442" text-anchor="middle" font-size="11" fill="#1e40af" font-family="sans-serif">módulo I2C (Adafruit u otro)</text>

    <g font-family="sans-serif" font-size="11" stroke="#1d4ed8" stroke-width="1.3">
      <line x1="190" y1="330" x2="328" y2="460"/>
      <line x1="190" y1="350" x2="328" y2="485"/>
      <line x1="190" y1="380" x2="328" y2="510"/>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#334155">
      <text x="200" y="326">GPIO 21</text>
      <text x="200" y="346">GPIO 22</text>
      <text x="200" y="376">3V3</text>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#1e40af" text-anchor="end">
      <text x="322" y="456">SDA</text>
      <text x="322" y="481">SCL</text>
      <text x="322" y="506">VIN</text>
    </g>
    <!-- GND del sensor -->
    <line x1="440" y1="530" x2="440" y2="560" stroke="#475569" stroke-width="2"/>
    <line x1="440" y1="560" x2="300" y2="560" stroke="#475569" stroke-width="2"/>
    <line x1="300" y1="560" x2="300" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="440" y="574" text-anchor="middle" font-size="10.5" fill="#475569">GND del sensor, mismo común</text>
  </g>

  <text x="450" y="605" text-anchor="middle" font-size="11" fill="#888">El sensor se alimenta del propio ESP32 (3V3); el motor nunca — necesita su fuente aparte por la corriente que pide.</text>
</svg>
