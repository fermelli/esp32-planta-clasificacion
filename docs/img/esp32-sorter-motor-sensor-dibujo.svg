<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta la cinta (L298N + motor) y el sensor de color</title>
<rect x="0" y="0" width="800" height="720" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta: cinta (L298N + motor) y sensor</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">El motor nunca toca el ESP32 directamente — siempre pasa por el L298N</text>

<!-- ESP32 -->
<rect x="30" y="100" width="160" height="420" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="110" y="128" text-anchor="middle" font-size="16" font-weight="800">ESP32 #2</text>
<text x="110" y="148" text-anchor="middle" font-size="12" fill="#64748b">sorter</text>
<text x="45" y="200" font-size="13" fill="#334155" font-weight="700">GPIO25 (ENA)</text>
<text x="45" y="235" font-size="13" fill="#334155" font-weight="700">GPIO26 (IN1)</text>
<text x="45" y="270" font-size="13" fill="#334155" font-weight="700">GPIO27 (IN2)</text>
<text x="45" y="340" font-size="13" fill="#334155" font-weight="700">GPIO21 (SDA)</text>
<text x="45" y="365" font-size="13" fill="#334155" font-weight="700">GPIO22 (SCL)</text>
<text x="45" y="395" font-size="13" fill="#334155" font-weight="700">3V3</text>
<text x="45" y="460" font-size="13" fill="#334155" font-weight="700">GPIO14 (botón)</text>
<text x="45" y="500" font-size="13" fill="#334155" font-weight="700">GND</text>

<!-- L298N board -->
<g>
  <rect x="330" y="90" width="220" height="130" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="440" y="115" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Módulo L298N</text>
  <rect x="345" y="125" width="16" height="10" fill="#fca5a5"/>
  <rect x="370" y="125" width="16" height="10" fill="#fca5a5"/>
  <rect x="395" y="125" width="16" height="10" fill="#fca5a5"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#991b1b">bornera ENA/IN1/IN2 arriba</text>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#991b1b">bornera OUT1/OUT2/VMS/GND abajo</text>
</g>

<!-- Wires ESP32 -> L298N -->
<line x1="190" y1="200" x2="330" y2="200" stroke="#ea580c" stroke-width="4"/>
<text x="200" y="194" font-size="11" fill="#c2410c">ENA (PWM)</text>
<line x1="190" y1="235" x2="330" y2="235" stroke="#0284c7" stroke-width="4"/>
<text x="200" y="229" font-size="11" fill="#075985">IN1</text>
<line x1="190" y1="270" x2="330" y2="270" stroke="#16a34a" stroke-width="4"/>
<text x="200" y="264" font-size="11" fill="#15803d">IN2</text>

<!-- Fuente 9V -->
<rect x="620" y="90" width="150" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="695" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Fuente 9V</text>
<text x="695" y="136" text-anchor="middle" font-size="11" fill="#166534">(de la vieja de PC)</text>
<text x="695" y="154" text-anchor="middle" font-size="11" fill="#166534">al VMS del L298N</text>
<line x1="620" y1="150" x2="550" y2="150" stroke="#dc2626" stroke-width="4"/>
<text x="558" y="144" font-size="11" fill="#991b1b">VMS 9V</text>

<!-- Motor -->
<circle cx="440" cy="280" r="0"/>
<g>
  <circle cx="695" cy="280" r="50" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="695" y="287" text-anchor="middle" font-size="16" font-weight="800" fill="#c2410c">M</text>
  <text x="695" y="345" text-anchor="middle" font-size="12" fill="#9a3412">Motor DC + reductora</text>
</g>
<line x1="550" y1="180" x2="645" y2="240" stroke="#78716c" stroke-width="4"/>
<line x1="550" y1="200" x2="645" y2="255" stroke="#78716c" stroke-width="4"/>
<text x="560" y="215" font-size="11" fill="#57534e">OUT1 / OUT2</text>

<!-- GND L298N -->
<line x1="440" y1="220" x2="440" y2="260" stroke="#111827" stroke-width="4"/>
<line x1="440" y1="260" x2="190" y2="260" stroke="#111827" stroke-width="4" stroke-dasharray="0"/>
<line x1="440" y1="220" x2="440" y2="220" stroke="none"/>

<!-- Sensor TCS3472 -->
<g>
  <rect x="330" y="330" width="220" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="358" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">TCS3472</text>
  <text x="440" y="376" text-anchor="middle" font-size="11" fill="#1e40af">módulo sensor de color</text>
  <rect x="410" y="386" width="60" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
</g>
<line x1="190" y1="340" x2="330" y2="340" stroke="#eab308" stroke-width="4"/>
<text x="200" y="334" font-size="11" fill="#854d0e">SDA</text>
<line x1="190" y1="365" x2="330" y2="365" stroke="#16a34a" stroke-width="4"/>
<text x="200" y="359" font-size="11" fill="#15803d">SCL</text>
<line x1="190" y1="395" x2="330" y2="395" stroke="#dc2626" stroke-width="4"/>
<text x="200" y="389" font-size="11" fill="#991b1b">VIN ← 3V3 del ESP32 (poco consumo)</text>

<!-- Boton cinta -->
<g>
  <rect x="330" y="460" width="150" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="405" cy="500" r="24" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
  <text x="405" y="565" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">Botón cinta</text>
</g>
<line x1="190" y1="460" x2="330" y2="490" stroke="#7c3aed" stroke-width="4"/>
<text x="200" y="454" font-size="11" fill="#6d28d9">GPIO14</text>
<line x1="330" y1="520" x2="190" y2="500" stroke="#111827" stroke-width="4"/>

<!-- GND bus -->
<line x1="190" y1="500" x2="190" y2="500" stroke="none"/>
<line x1="695" y1="180" x2="695" y2="180" stroke="none"/>
<line x1="620" y1="150" x2="620" y2="150" stroke="none"/>
<line x1="620" y1="150" x2="620" y2="620" stroke="#111827" stroke-width="4"/>
<line x1="620" y1="620" x2="110" y2="620" stroke="#111827" stroke-width="4"/>
<line x1="110" y1="620" x2="110" y2="520" stroke="#111827" stroke-width="4"/>
<text x="400" y="642" text-anchor="middle" font-size="14" font-weight="800" fill="#111">GND común: ESP32 + fuente 9V + L298N + sensor + botón</text>

<!-- Steps -->
<g font-family="sans-serif" font-size="12.5" fill="#334155">
  <text x="60" y="670">① ENA/IN1/IN2 del L298N a GPIO25/26/27 · ② VMS del L298N a la fuente de 9V (nunca al ESP32)</text>
  <text x="60" y="688">③ OUT1/OUT2 del L298N al motor (cualquier orden) · ④ Sensor VIN a 3V3 (sí puede, consume poco)</text>
</g>

<rect x="30" y="700" width="740" height="15" rx="8" fill="#fef2f2" stroke="none"/>
</svg>
