<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 775" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta la cinta (L298N + motor) y el sensor de color</title>
<rect x="0" y="0" width="800" height="775" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta: cinta (L298N + motor) y sensor</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">El motor nunca toca el ESP32 directamente — siempre pasa por el L298N</text>

<!-- ESP32 -->
<rect x="30" y="100" width="160" height="540" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="110" y="128" text-anchor="middle" font-size="16" font-weight="800">ESP32 #2</text>
<text x="110" y="148" text-anchor="middle" font-size="12" fill="#64748b">sorter</text>
<circle cx="185" cy="170" r="5" fill="#111"/>
<text x="45" y="174" font-size="12.5" fill="#334155" font-weight="700">GPIO25 (ENA)</text>
<circle cx="185" cy="200" r="5" fill="#111"/>
<text x="45" y="204" font-size="12.5" fill="#334155" font-weight="700">GPIO26 (IN1)</text>
<circle cx="185" cy="230" r="5" fill="#111"/>
<text x="45" y="234" font-size="12.5" fill="#334155" font-weight="700">GPIO27 (IN2)</text>
<circle cx="185" cy="420" r="5" fill="#111"/>
<text x="45" y="424" font-size="12.5" fill="#334155" font-weight="700">GPIO21 (SDA)</text>
<circle cx="185" cy="445" r="5" fill="#111"/>
<text x="45" y="449" font-size="12.5" fill="#334155" font-weight="700">GPIO22 (SCL)</text>
<circle cx="185" cy="470" r="5" fill="#111"/>
<text x="45" y="474" font-size="12.5" fill="#334155" font-weight="700">3V3</text>
<circle cx="185" cy="560" r="5" fill="#111"/>
<text x="45" y="564" font-size="12.5" fill="#334155" font-weight="700">GPIO14 (botón)</text>
<circle cx="185" cy="600" r="5" fill="#111"/>
<text x="45" y="604" font-size="12.5" fill="#334155" font-weight="700">GND</text>

<!-- L298N board -->
<g>
  <rect x="300" y="120" width="220" height="140" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="410" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Módulo L298N</text>
  <text x="308" y="166" font-size="11" fill="#991b1b">ENA</text>
  <text x="308" y="196" font-size="11" fill="#991b1b">IN1</text>
  <text x="308" y="226" font-size="11" fill="#991b1b">IN2</text>
  <text x="440" y="252" text-anchor="middle" font-size="10.5" fill="#991b1b">VMS</text>
  <text x="480" y="252" text-anchor="middle" font-size="10.5" fill="#991b1b">GND</text>
</g>

<!-- Wires ESP32 -> L298N -->
<line x1="190" y1="170" x2="300" y2="170" stroke="#ea580c" stroke-width="4"/>
<line x1="190" y1="200" x2="300" y2="200" stroke="#0284c7" stroke-width="4"/>
<line x1="190" y1="230" x2="300" y2="230" stroke="#16a34a" stroke-width="4"/>

<!-- L298N -> motor -->
<line x1="520" y1="175" x2="648" y2="175" stroke="#78716c" stroke-width="4"/>
<line x1="520" y1="205" x2="648" y2="205" stroke="#78716c" stroke-width="4"/>
<text x="524" y="167" font-size="11" fill="#57534e">OUT1</text>
<text x="524" y="223" font-size="11" fill="#57534e">OUT2</text>

<!-- Motor -->
<g>
  <circle cx="690" cy="190" r="45" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="690" y="197" text-anchor="middle" font-size="16" font-weight="800" fill="#c2410c">M</text>
  <text x="690" y="252" text-anchor="middle" font-size="12" fill="#9a3412">Motor TT amarillo (3-6V)</text>
</g>

<!-- L298N -> Fuente (VMS y GND) -->
<line x1="440" y1="260" x2="440" y2="300" stroke="#dc2626" stroke-width="4"/>
<line x1="480" y1="260" x2="480" y2="280" stroke="#111827" stroke-width="4"/>
<line x1="480" y1="280" x2="480" y2="300" stroke="#111827" stroke-width="4"/>
<line x1="480" y1="280" x2="620" y2="280" stroke="#111827" stroke-width="4"/>
<circle cx="480" cy="280" r="3.5" fill="#111827"/>

<!-- Fuente 6V -->
<g>
  <rect x="400" y="300" width="160" height="85" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="312" text-anchor="middle" font-size="9.5" fill="#166534">+6V</text>
  <text x="480" y="312" text-anchor="middle" font-size="9.5" fill="#166534">GND</text>
  <text x="480" y="336" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Fuente 6V</text>
  <text x="480" y="354" text-anchor="middle" font-size="11" fill="#166534">la misma del servo</text>
  <text x="480" y="371" text-anchor="middle" font-size="11" fill="#166534">al VMS del L298N</text>
</g>

<!-- Sensor TCS3472 -->
<g>
  <rect x="300" y="400" width="220" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="410" y="424" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">TCS3472</text>
  <rect x="380" y="436" width="60" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="308" y="416" font-size="11" fill="#1e40af">SDA</text>
  <text x="308" y="441" font-size="11" fill="#1e40af">SCL</text>
  <text x="308" y="466" font-size="11" fill="#1e40af">VIN</text>
  <text x="513" y="481" text-anchor="end" font-size="11" fill="#991b1b">GND</text>
</g>
<line x1="190" y1="420" x2="300" y2="420" stroke="#eab308" stroke-width="4"/>
<line x1="190" y1="445" x2="300" y2="445" stroke="#16a34a" stroke-width="4"/>
<line x1="190" y1="470" x2="300" y2="470" stroke="#dc2626" stroke-width="4"/>
<line x1="520" y1="485" x2="620" y2="485" stroke="#111827" stroke-width="4"/>

<!-- Boton cinta -->
<g>
  <rect x="300" y="530" width="120" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="360" cy="580" r="22" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
  <text x="360" y="552" text-anchor="middle" font-size="12.5" font-weight="800" fill="#92400e">Botón cinta</text>
</g>
<line x1="190" y1="560" x2="300" y2="560" stroke="#7c3aed" stroke-width="4"/>
<line x1="420" y1="600" x2="620" y2="600" stroke="#111827" stroke-width="4"/>

<!-- GND: riel único a la derecha -->
<line x1="620" y1="280" x2="620" y2="660" stroke="#111827" stroke-width="4"/>
<line x1="620" y1="660" x2="185" y2="660" stroke="#111827" stroke-width="4"/>
<line x1="185" y1="660" x2="185" y2="600" stroke="#111827" stroke-width="4"/>
<circle cx="620" cy="280" r="3.5" fill="#111827"/>
<circle cx="620" cy="485" r="3.5" fill="#111827"/>
<circle cx="620" cy="600" r="3.5" fill="#111827"/>

<text x="400" y="682" text-anchor="middle" font-size="14" font-weight="800" fill="#111">GND común: ESP32 + fuente 6V + L298N + sensor + botón</text>

<!-- Steps -->
<g font-family="sans-serif" font-size="12.5" fill="#334155">
  <text x="60" y="706">① ENA/IN1/IN2 del L298N a GPIO25/26/27 · ② VMS del L298N a la fuente de 6V (nunca al ESP32)</text>
  <text x="60" y="724">③ OUT1/OUT2 del L298N al motor (cualquier orden) · ④ Sensor VIN a 3V3 (sí puede, consume poco)</text>
</g>

<rect x="30" y="736" width="740" height="28" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="755" text-anchor="middle" font-size="12.5" fill="#991b1b" font-weight="700">⚠ El motor nunca se alimenta del ESP32 — el L298N puede pedir hasta 2A al arranque.</text>
</svg>
