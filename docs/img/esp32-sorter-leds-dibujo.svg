<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta cada LED con su resistencia</title>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta cada LED (uno de 9, todos igual)</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#555">GPIO → resistencia 220Ω → pata larga (ánodo) → LED → pata corta (cátodo) → GND</text>

<!-- Big LED detail -->
<g transform="translate(60,90)">
  <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">① Fijate cuál pata es cuál</text>
  <!-- LED bulb -->
  <path d="M 60 40 a 50 50 0 1 1 100 0 v 40 h -100 z" fill="#fca5a5" stroke="#111" stroke-width="2.5"/>
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="700">LED</text>
  <!-- flat edge marker (cátodo side) -->
  <rect x="146" y="80" width="8" height="30" fill="#111"/>
  <text x="180" y="100" font-size="11" fill="#57534e">borde plano = cátodo</text>
  <!-- long leg (anodo) -->
  <line x1="70" y1="120" x2="70" y2="200" stroke="#111" stroke-width="3"/>
  <text x="15" y="215" font-size="12" fill="#166534" font-weight="700">pata LARGA</text>
  <text x="15" y="230" font-size="12" fill="#166534" font-weight="700">= ánodo (+)</text>
  <!-- short leg (catodo) -->
  <line x1="150" y1="120" x2="150" y2="170" stroke="#111" stroke-width="3"/>
  <text x="165" y="185" font-size="12" fill="#7f1d1d" font-weight="700">pata CORTA</text>
  <text x="165" y="200" font-size="12" fill="#7f1d1d" font-weight="700">= cátodo (−)</text>
</g>

<!-- Resistor detail -->
<g transform="translate(430,90)">
  <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">② Resistencia de 220Ω (no importa el sentido)</text>
  <line x1="0" y1="60" x2="40" y2="60" stroke="#111" stroke-width="3"/>
  <rect x="40" y="45" width="110" height="30" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="55" y="45" width="8" height="30" fill="#dc2626"/>
  <rect x="75" y="45" width="8" height="30" fill="#dc2626"/>
  <rect x="95" y="45" width="8" height="30" fill="#7c3e10"/>
  <rect x="115" y="45" width="8" height="30" fill="#eab308"/>
  <line x1="150" y1="60" x2="190" y2="60" stroke="#111" stroke-width="3"/>
  <text x="95" y="100" text-anchor="middle" font-size="12" fill="#78350f">rojo-rojo-marrón = 220Ω</text>
</g>

<!-- Wiring chain -->
<g transform="translate(0,260)" font-family="sans-serif">
  <text x="400" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">③ La cadena completa (se repite igual para los 9 LEDs)</text>

  <rect x="30" y="30" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="85" y="60" text-anchor="middle" font-size="13" font-weight="700">GPIO</text>

  <line x1="140" y1="55" x2="210" y2="55" stroke="#334155" stroke-width="4"/>

  <rect x="210" y="35" width="110" height="40" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="265" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">220Ω</text>

  <line x1="320" y1="55" x2="390" y2="55" stroke="#334155" stroke-width="4"/>

  <path d="M 390 25 a 32 32 0 1 1 64 0 v 30 h -64 z" fill="#fca5a5" stroke="#111" stroke-width="2.5" transform="translate(0,0)"/>
  <text x="422" y="45" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="700">LED</text>
  <text x="422" y="20" text-anchor="middle" font-size="11" fill="#166534">ánodo (larga) entra acá →</text>

  <line x1="454" y1="55" x2="520" y2="55" stroke="#111827" stroke-width="4"/>
  <text x="480" y="45" text-anchor="middle" font-size="10" fill="#7f1d1d">cátodo (corta)</text>

  <rect x="520" y="30" width="150" height="50" rx="8" fill="#f1f5f9" stroke="#111827" stroke-width="2"/>
  <text x="595" y="60" text-anchor="middle" font-size="13" font-weight="700">GND común</text>
</g>

<!-- Color/pin table -->
<g transform="translate(30,400)" font-family="sans-serif">
  <text x="0" y="0" font-size="14" font-weight="700" fill="#334155">④ Los 9 pines (peso binario 4 / 2 / 1 por color)</text>
  <rect x="0" y="15" width="220" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="110" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">Rojo</text>
  <text x="110" y="58" text-anchor="middle" font-size="12" fill="#7f1d1d">GPIO 16, 17, 5</text>
  <text x="110" y="76" text-anchor="middle" font-size="11" fill="#991b1b">peso 4 / 2 / 1</text>

  <rect x="240" y="15" width="220" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">Verde</text>
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#14532d">GPIO 18, 19, 23</text>
  <text x="350" y="76" text-anchor="middle" font-size="11" fill="#166534">peso 4 / 2 / 1</text>

  <rect x="480" y="15" width="220" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">Azul</text>
  <text x="590" y="58" text-anchor="middle" font-size="12" fill="#1e40af">GPIO 32, 33, 12</text>
  <text x="590" y="76" text-anchor="middle" font-size="11" fill="#1e3a8a">peso 4 / 2 / 1</text>
</g>

<rect x="30" y="500" width="740" height="30" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="520" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">⚠ Sin la resistencia el LED se quema casi de inmediato — nunca lo conectes directo al GPIO.</text>
</svg>
