<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>ESP32 #2 (sorter) — 9 LEDs y resistencias del contador binario</title>
<rect x="0" y="0" width="800" height="640" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#111">El esquema: 9 LEDs — contador binario 0 a 5</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#555">GPIO → resistencia 220Ω → ánodo del LED → cátodo → GND común (misma cadena × 9)</text>

<!-- columns: rojo, verde, azul -->
<g font-family="sans-serif">
<!-- ROJO -->
<text x="150" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#dc2626">Rojo</text>
<g font-size="13" fill="#334155">
<text x="70" y="135" text-anchor="end">GPIO16</text>
<text x="70" y="235" text-anchor="end">GPIO17</text>
<text x="70" y="335" text-anchor="end">GPIO5</text>
</g>
<g font-size="11.5" fill="#64748b">
<text x="185" y="135">peso 4</text>
<text x="185" y="235">peso 2</text>
<text x="185" y="335">peso 1</text>
</g>
<g stroke="#334155" stroke-width="3">
<line x1="80" y1="130" x2="115" y2="130"/>
<line x1="80" y1="230" x2="115" y2="230"/>
<line x1="80" y1="330" x2="115" y2="330"/>
</g>
<g>
<rect x="115" y="117" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="115" y="217" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="115" y="317" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
</g>
<g stroke="#334155" stroke-width="3">
<line x1="150" y1="130" x2="150" y2="130"/>
</g>
<line x1="150" y1="130" x2="150" y2="130" stroke="none"/>
<circle cx="150" cy="130" r="0"/>
<g fill="#fca5a5" stroke="#111" stroke-width="2">
<circle cx="180" cy="130" r="20"/>
<circle cx="180" cy="230" r="20"/>
<circle cx="180" cy="330" r="20"/>
</g>
<line x1="150" y1="130" x2="160" y2="130" stroke="#334155" stroke-width="3"/>
<line x1="150" y1="230" x2="160" y2="230" stroke="#334155" stroke-width="3"/>
<line x1="150" y1="330" x2="160" y2="330" stroke="#334155" stroke-width="3"/>
<line x1="200" y1="130" x2="215" y2="130" stroke="#111827" stroke-width="3"/>
<line x1="200" y1="230" x2="215" y2="230" stroke="#111827" stroke-width="3"/>
<line x1="200" y1="330" x2="215" y2="330" stroke="#111827" stroke-width="3"/>
<line x1="215" y1="130" x2="215" y2="560" stroke="#111827" stroke-width="3"/>
<line x1="215" y1="230" x2="215" y2="230" stroke="none"/>

<!-- VERDE -->
<text x="400" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#16a34a">Verde</text>
<g font-size="13" fill="#334155">
<text x="320" y="135" text-anchor="end">GPIO18</text>
<text x="320" y="235" text-anchor="end">GPIO19</text>
<text x="320" y="335" text-anchor="end">GPIO23</text>
</g>
<g font-size="11.5" fill="#64748b">
<text x="435" y="135">peso 4</text>
<text x="435" y="235">peso 2</text>
<text x="435" y="335">peso 1</text>
</g>
<g stroke="#334155" stroke-width="3">
<line x1="330" y1="130" x2="365" y2="130"/>
<line x1="330" y1="230" x2="365" y2="230"/>
<line x1="330" y1="330" x2="365" y2="330"/>
</g>
<g>
<rect x="365" y="117" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="365" y="217" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="365" y="317" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
</g>
<g fill="#86efac" stroke="#111" stroke-width="2">
<circle cx="430" cy="130" r="20"/>
<circle cx="430" cy="230" r="20"/>
<circle cx="430" cy="330" r="20"/>
</g>
<line x1="400" y1="130" x2="410" y2="130" stroke="#334155" stroke-width="3"/>
<line x1="400" y1="230" x2="410" y2="230" stroke="#334155" stroke-width="3"/>
<line x1="400" y1="330" x2="410" y2="330" stroke="#334155" stroke-width="3"/>
<line x1="450" y1="130" x2="465" y2="130" stroke="#111827" stroke-width="3"/>
<line x1="450" y1="230" x2="465" y2="230" stroke="#111827" stroke-width="3"/>
<line x1="450" y1="330" x2="465" y2="330" stroke="#111827" stroke-width="3"/>
<line x1="465" y1="130" x2="465" y2="560" stroke="#111827" stroke-width="3"/>

<!-- AZUL -->
<text x="650" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#2563eb">Azul</text>
<g font-size="13" fill="#334155">
<text x="570" y="135" text-anchor="end">GPIO32</text>
<text x="570" y="235" text-anchor="end">GPIO33</text>
<text x="570" y="335" text-anchor="end">GPIO12</text>
</g>
<g font-size="11.5" fill="#64748b">
<text x="685" y="135">peso 4</text>
<text x="685" y="235">peso 2</text>
<text x="685" y="335">peso 1</text>
</g>
<g stroke="#334155" stroke-width="3">
<line x1="580" y1="130" x2="615" y2="130"/>
<line x1="580" y1="230" x2="615" y2="230"/>
<line x1="580" y1="330" x2="615" y2="330"/>
</g>
<g>
<rect x="615" y="117" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="615" y="217" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<rect x="615" y="317" width="35" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
</g>
<g fill="#93c5fd" stroke="#111" stroke-width="2">
<circle cx="680" cy="130" r="20"/>
<circle cx="680" cy="230" r="20"/>
<circle cx="680" cy="330" r="20"/>
</g>
<line x1="650" y1="130" x2="660" y2="130" stroke="#334155" stroke-width="3"/>
<line x1="650" y1="230" x2="660" y2="230" stroke="#334155" stroke-width="3"/>
<line x1="650" y1="330" x2="660" y2="330" stroke="#334155" stroke-width="3"/>
<line x1="700" y1="130" x2="715" y2="130" stroke="#111827" stroke-width="3"/>
<line x1="700" y1="230" x2="715" y2="230" stroke="#111827" stroke-width="3"/>
<line x1="700" y1="330" x2="715" y2="330" stroke="#111827" stroke-width="3"/>
<line x1="715" y1="130" x2="715" y2="560" stroke="#111827" stroke-width="3"/>
</g>

<!-- GND bus -->
<line x1="215" y1="560" x2="715" y2="560" stroke="#111827" stroke-width="5"/>
<text x="465" y="585" text-anchor="middle" font-size="14" font-weight="800" fill="#111">GND común (los 9 LEDs comparten el mismo GND del ESP32)</text>

<text x="400" y="620" text-anchor="middle" font-size="11.5" fill="#888">Sin la resistencia de 220Ω, el LED se quema casi de inmediato.</text>
</svg>
