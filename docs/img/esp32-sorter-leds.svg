<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>ESP32 #2 (sorter) — 9 LEDs y resistencias del contador binario</title>
