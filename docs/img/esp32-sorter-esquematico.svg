<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>ESP32 #2 (sorter) — esquemático de conexión (Bloque 1)</title>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#111">El esquema: puerta (servo + botón)</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#555">rojo = V+ · negro = GND · naranja = señal PWM · morado = señal del botón</text>

<!-- ESP32 -->
<rect x="30" y="100" width="170" height="300" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="115" y="130" text-anchor="middle" font-size="16" font-weight="800">ESP32 #2</text>
<text x="115" y="150" text-anchor="middle" font-size="12" fill="#64748b">sorter</text>

<!-- Servo box -->
<rect x="590" y="80" width="180" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="680" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Servo puerta</text>
<text x="680" y="124" text-anchor="middle" font-size="12" fill="#1e40af">SG90 (máx 6V)</text>
<text x="610" y="150" font-size="12" fill="#334155">Señal</text>
<text x="610" y="170" font-size="12" fill="#334155">V+</text>
<text x="610" y="190" font-size="12" fill="#334155">GND</text>

<!-- Boton box -->
<rect x="590" y="230" width="180" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="680" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Botón puerta</text>
<text x="610" y="280" font-size="12" fill="#78350f">a GPIO4</text>
<text x="610" y="300" font-size="12" fill="#78350f">a GND</text>

<!-- Fuente 6V box -->
<rect x="590" y="350" width="180" height="70" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="680" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Fuente 6V</text>
<text x="680" y="394" text-anchor="middle" font-size="11" fill="#166534">no el pin 5V del ESP32</text>

<!-- Wires: GPIO13 -> señal (naranja), orthogonal -->
<line x1="200" y1="150" x2="500" y2="150" stroke="#ea580c" stroke-width="3"/>
<line x1="500" y1="150" x2="500" y2="150" stroke="#ea580c" stroke-width="3"/>
<line x1="500" y1="150" x2="590" y2="150" stroke="#ea580c" stroke-width="3"/>
<text x="230" y="144" font-size="12" fill="#334155" font-weight="700">GPIO13</text>
<line x1="200" y1="150" x2="200" y2="150" stroke="none"/>

<!-- Wires: fuente V+ -> servo V+ (rojo) -->
<line x1="680" y1="350" x2="680" y2="280" stroke="#dc2626" stroke-width="3"/>
<line x1="680" y1="280" x2="500" y2="280" stroke="#dc2626" stroke-width="3"/>
<line x1="500" y1="280" x2="500" y2="170" stroke="#dc2626" stroke-width="3"/>
<line x1="500" y1="170" x2="590" y2="170" stroke="#dc2626" stroke-width="3"/>
<text x="330" y="274" font-size="12" fill="#991b1b" font-weight="700">V+ 6V (fuente externa)</text>

<!-- Wires: GPIO4 -> boton (morado) -->
<line x1="200" y1="220" x2="440" y2="220" stroke="#7c3aed" stroke-width="3"/>
<line x1="440" y1="220" x2="440" y2="280" stroke="#7c3aed" stroke-width="3"/>
<line x1="440" y1="280" x2="590" y2="280" stroke="#7c3aed" stroke-width="3"/>
<text x="230" y="214" font-size="12" fill="#334155" font-weight="700">GPIO4</text>

<!-- GND bus -->
<line x1="115" y1="400" x2="115" y2="470" stroke="#111827" stroke-width="4"/>
<line x1="115" y1="470" x2="720" y2="470" stroke="#111827" stroke-width="4"/>
<line x1="590" y1="190" x2="560" y2="190" stroke="#111827" stroke-width="3"/>
<line x1="560" y1="190" x2="560" y2="470" stroke="#111827" stroke-width="3"/>
<line x1="590" y1="300" x2="565" y2="300" stroke="#111827" stroke-width="3"/>
<line x1="565" y1="300" x2="565" y2="470" stroke="#111827" stroke-width="3"/>
<line x1="720" y1="420" x2="720" y2="470" stroke="#111827" stroke-width="3"/>
<text x="400" y="490" text-anchor="middle" font-size="13" font-weight="800" fill="#111">GND común (ESP32 + fuente + servo + botón)</text>

<text x="400" y="520" text-anchor="middle" font-size="12" fill="#888">Sin el GND común, el ESP32 se reinicia apenas el servo empieza a moverse.</text>
<rect x="30" y="440" width="0" height="0"/>
</svg>
