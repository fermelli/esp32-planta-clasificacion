<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ESP32 #1 (gateway) — esquemático de conexión</title>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">ESP32 #1 (gateway) — esquemático de conexión</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#555">Qué componente va a cada pin. Para la posición física real en la placa, ver esp32-gateway-conexiones.svg</text>

  <g transform="translate(0,70)">
    <rect x="360" y="110" width="170" height="290" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="445" y="140" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="600">ESP32 #1</text>
    <text x="445" y="158" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#64748b">gateway</text>

    <!-- Teclado 4x4 -->
    <rect x="50" y="120" width="180" height="270" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="140" y="145" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">Teclado 4x4</text>
    <text x="140" y="162" text-anchor="middle" font-size="11" fill="#9a3412" font-family="sans-serif">matricial, sin alimentación</text>
    <g stroke="#c2410c" stroke-width="1.2" fill="none">
      <rect x="95" y="175" width="90" height="90"/>
      <line x1="117.5" y1="175" x2="117.5" y2="265"/>
      <line x1="140" y1="175" x2="140" y2="265"/>
      <line x1="162.5" y1="175" x2="162.5" y2="265"/>
      <line x1="95" y1="197.5" x2="185" y2="197.5"/>
      <line x1="95" y1="220" x2="185" y2="220"/>
      <line x1="95" y1="242.5" x2="185" y2="242.5"/>
    </g>

    <g font-family="sans-serif" font-size="11" stroke="#c2410c" stroke-width="1.3">
      <line x1="230" y1="150" x2="358" y2="150"/>
      <line x1="230" y1="180" x2="358" y2="180"/>
      <line x1="230" y1="210" x2="358" y2="210"/>
      <line x1="230" y1="240" x2="358" y2="240"/>
      <line x1="230" y1="270" x2="358" y2="270"/>
      <line x1="230" y1="300" x2="358" y2="300"/>
      <line x1="230" y1="330" x2="358" y2="330"/>
      <line x1="230" y1="360" x2="358" y2="360"/>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#7c2d12">
      <text x="238" y="146">Fila 1</text>
      <text x="238" y="176">Fila 2</text>
      <text x="238" y="206">Fila 3</text>
      <text x="238" y="236">Fila 4</text>
      <text x="238" y="266">Col 1</text>
      <text x="238" y="296">Col 2</text>
      <text x="238" y="326">Col 3</text>
      <text x="238" y="356">Col 4</text>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#334155" text-anchor="end">
      <text x="352" y="146">GPIO 13</text>
      <text x="352" y="176">GPIO 14</text>
      <text x="352" y="206">GPIO 27</text>
      <text x="352" y="236">GPIO 26</text>
      <text x="352" y="266">GPIO 25</text>
      <text x="352" y="296">GPIO 33</text>
      <text x="352" y="326">GPIO 32</text>
      <text x="352" y="356">GPIO 15</text>
    </g>

    <!-- LCD I2C -->
    <rect x="660" y="150" width="190" height="150" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="755" y="175" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">LCD 16x2 I2C</text>
    <text x="755" y="192" text-anchor="middle" font-size="11" fill="#166534" font-family="sans-serif">módulo PCF8574, addr 0x27</text>

    <g font-family="sans-serif" font-size="11" stroke="#15803d" stroke-width="1.3">
      <line x1="530" y1="210" x2="658" y2="210"/>
      <line x1="530" y1="235" x2="658" y2="235"/>
      <line x1="530" y1="260" x2="658" y2="260"/>
      <line x1="530" y1="285" x2="658" y2="285"/>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#334155">
      <text x="536" y="206">GPIO 21</text>
      <text x="536" y="231">GPIO 22</text>
      <text x="536" y="256">VIN</text>
      <text x="536" y="281">GND</text>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#166534" text-anchor="end">
      <text x="652" y="206">SDA</text>
      <text x="652" y="231">SCL</text>
      <text x="652" y="256">VCC</text>
      <text x="652" y="281">GND</text>
    </g>
  </g>

  <text x="450" y="545" text-anchor="middle" font-size="11" fill="#888">8 GPIO para el teclado (4 filas + 4 columnas) + 4 para el LCD por I2C. Ningún componente necesita fuente externa.</text>
</svg>
