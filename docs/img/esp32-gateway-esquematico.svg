<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>ESP32 #1 (gateway) — esquemático de conexión</title>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#111">El esquema: teclado 4x4 + pantalla LCD</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#555">Qué GPIO va a cada pin. Posición física real en esp32-gateway-conexiones.svg</text>
<text x="400" y="76" text-anchor="middle" font-size="12" fill="#555">GPIO21 → SDA · GPIO22 → SCL · VIN → VCC (5V, no 3V3) · GND → GND</text>

<!-- ESP32 -->
<rect x="320" y="90" width="160" height="300" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400" y="120" text-anchor="middle" font-size="16" font-weight="800">ESP32 #1</text>
<text x="400" y="140" text-anchor="middle" font-size="12" fill="#64748b">gateway</text>

<!-- Teclado box -->
<rect x="30" y="90" width="220" height="290" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="140" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Teclado 4x4</text>
<text x="140" y="134" text-anchor="middle" font-size="11" fill="#9a3412">sin resistencias externas</text>
<g font-size="13" fill="#7c2d12">
<text x="50" y="164">Fila 1</text><text x="50" y="192">Fila 2</text><text x="50" y="220">Fila 3</text><text x="50" y="248">Fila 4</text>
<text x="50" y="276">Col 1</text><text x="50" y="304">Col 2</text><text x="50" y="332">Col 3</text><text x="50" y="360">Col 4</text>
</g>

<!-- LCD box -->
<rect x="560" y="150" width="200" height="170" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="660" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">LCD 16x2 I2C</text>
<text x="660" y="196" text-anchor="middle" font-size="11" fill="#166534">módulo PCF8574, addr 0x27</text>
<g font-size="13" fill="#334155">
<text x="580" y="228">SDA</text><text x="580" y="256">SCL</text><text x="580" y="284">VCC</text><text x="580" y="312">GND</text>
</g>

<!-- Wires: keypad -> ESP32 -->
<g stroke="#c2410c" stroke-width="3">
<line x1="250" y1="160" x2="320" y2="160"/>
<line x1="250" y1="188" x2="320" y2="188"/>
<line x1="250" y1="216" x2="320" y2="216"/>
<line x1="250" y1="244" x2="320" y2="244"/>
<line x1="250" y1="272" x2="320" y2="272"/>
<line x1="250" y1="300" x2="320" y2="300"/>
<line x1="250" y1="328" x2="320" y2="328"/>
<line x1="250" y1="356" x2="320" y2="356"/>
</g>
<g font-size="13" fill="#334155" font-weight="700">
<text x="255" y="154">GPIO13</text><text x="255" y="182">GPIO14</text><text x="255" y="210">GPIO27</text><text x="255" y="238">GPIO26</text>
<text x="255" y="266">GPIO25</text><text x="255" y="294">GPIO33</text><text x="255" y="322">GPIO32</text><text x="255" y="350">GPIO15</text>
</g>

<!-- Wires: ESP32 -> LCD (SDA/SCL/VCC/GND), un destino distinto para cada una -->
<line x1="480" y1="160" x2="500" y2="160" stroke="#eab308" stroke-width="3"/>
<line x1="500" y1="160" x2="500" y2="228" stroke="#eab308" stroke-width="3"/>
<line x1="500" y1="228" x2="560" y2="228" stroke="#eab308" stroke-width="3"/>

<line x1="480" y1="190" x2="515" y2="190" stroke="#16a34a" stroke-width="3"/>
<line x1="515" y1="190" x2="515" y2="256" stroke="#16a34a" stroke-width="3"/>
<line x1="515" y1="256" x2="560" y2="256" stroke="#16a34a" stroke-width="3"/>

<line x1="480" y1="220" x2="530" y2="220" stroke="#dc2626" stroke-width="3"/>
<line x1="530" y1="220" x2="530" y2="284" stroke="#dc2626" stroke-width="3"/>
<line x1="530" y1="284" x2="560" y2="284" stroke="#dc2626" stroke-width="3"/>

<line x1="480" y1="250" x2="545" y2="250" stroke="#111827" stroke-width="3"/>
<line x1="545" y1="250" x2="545" y2="312" stroke="#111827" stroke-width="3"/>
<line x1="545" y1="312" x2="560" y2="312" stroke="#111827" stroke-width="3"/>

<rect x="30" y="410" width="740" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="400" y="434" text-anchor="middle" font-size="13.5" fill="#14532d" font-weight="700">8 GPIO para el teclado (4 filas + 4 columnas) + 4 para el LCD por I2C.</text>
<text x="400" y="454" text-anchor="middle" font-size="13" fill="#166534">Ningún componente de esta placa necesita fuente externa — alcanza con el cargador USB.</text>

<text x="400" y="500" text-anchor="middle" font-size="12" fill="#888">Teclado con pull-up interno del ESP32: no lleva resistencias.</text>
</svg>
