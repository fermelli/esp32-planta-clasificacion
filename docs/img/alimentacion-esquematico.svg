<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Esquema de alimentación</title>
<rect x="0" y="0" width="800" height="620" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Esquema de alimentación</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">rojo = V+ · negro = GND · el 6V alimenta servo y motor a la vez</text>

<!-- ESP32 sorter -->
<rect x="30" y="90" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="120" y="120" text-anchor="middle" font-size="15" font-weight="700">ESP32 #2 (sorter)</text>
<text x="120" y="140" text-anchor="middle" font-size="12" fill="#64748b">cargador USB propio</text>

<!-- ESP32 gateway -->
<rect x="590" y="90" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680" y="120" text-anchor="middle" font-size="15" font-weight="700">ESP32 #1 (gateway)</text>
<text x="680" y="140" text-anchor="middle" font-size="12" fill="#64748b">cargador USB propio</text>

<!-- Fuente vieja -->
<rect x="250" y="230" width="300" height="110" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
<text x="400" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Fuente vieja de PC</text>
<rect x="280" y="270" width="100" height="45" fill="#ffffff" stroke="#78716c"/>
<text x="330" y="298" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">6V</text>
<rect x="420" y="270" width="100" height="45" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
<text x="470" y="298" text-anchor="middle" font-size="14" fill="#6b7280">12V (no usar)</text>

<!-- Servo -->
<rect x="30" y="420" width="180" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="120" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Servo SG90</text>
<text x="120" y="468" text-anchor="middle" font-size="12" fill="#9a3412">V+ máx 6V</text>
<text x="120" y="486" text-anchor="middle" font-size="12" fill="#9a3412">Señal → GPIO13</text>

<!-- L298N -->
<rect x="590" y="420" width="180" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="680" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">L298N + motor TT</text>
<text x="680" y="468" text-anchor="middle" font-size="12" fill="#991b1b">VMS 3-6V</text>
<text x="680" y="486" text-anchor="middle" font-size="12" fill="#991b1b">acá: 6V</text>

<!-- Wires: 6V se reparte a servo y L298N (rojo) -->
<line x1="330" y1="315" x2="330" y2="380" stroke="#dc2626" stroke-width="3"/>
<circle cx="330" cy="380" r="5" fill="#dc2626"/>
<line x1="330" y1="380" x2="120" y2="380" stroke="#dc2626" stroke-width="3"/>
<line x1="120" y1="380" x2="120" y2="420" stroke="#dc2626" stroke-width="3"/>
<line x1="330" y1="380" x2="680" y2="380" stroke="#dc2626" stroke-width="3"/>
<line x1="680" y1="380" x2="680" y2="420" stroke="#dc2626" stroke-width="3"/>
<text x="400" y="374" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">V+ 6V (mismo rail para los dos)</text>

<!-- GND bus -->
<line x1="30" y1="560" x2="770" y2="560" stroke="#111827" stroke-width="4"/>
<line x1="120" y1="510" x2="120" y2="560" stroke="#111827" stroke-width="3"/>
<line x1="680" y1="510" x2="680" y2="560" stroke="#111827" stroke-width="3"/>
<line x1="330" y1="340" x2="330" y2="560" stroke="#111827" stroke-width="3"/>
<line x1="120" y1="160" x2="120" y2="560" stroke="#111827" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="680" y1="160" x2="680" y2="560" stroke="#111827" stroke-width="3" stroke-dasharray="6 4"/>
<text x="400" y="584" text-anchor="middle" font-size="14" font-weight="800" fill="#111">GND común: fuente + servo + L298N + ambos ESP32</text>

<text x="400" y="604" text-anchor="middle" font-size="11.5" fill="#888">La salida de 6V tiene que aguantar ~2A (servo + motor juntos).</text>
</svg>
