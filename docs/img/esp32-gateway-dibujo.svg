<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta el teclado 4x4 y la pantalla LCD</title>
<rect x="0" y="0" width="800" height="620" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta: teclado 4x4 + pantalla LCD</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#555">8 cables al teclado (sin resistencias) + 4 cables a la pantalla por I2C</text>

<!-- ESP32 -->
<rect x="330" y="90" width="150" height="380" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="405" y="120" text-anchor="middle" font-size="16" font-weight="800">ESP32 #1</text>
<text x="405" y="140" text-anchor="middle" font-size="12" fill="#64748b">gateway</text>

<!-- Teclado -->
<g>
  <rect x="30" y="100" width="230" height="230" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="145" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#7c2d12">Teclado matricial 4x4</text>
  <text x="145" y="144" text-anchor="middle" font-size="11" fill="#9a3412">8 pines: no lleva resistencias</text>
  <g stroke="#c2410c" stroke-width="1.5" fill="none">
    <rect x="65" y="160" width="160" height="150"/>
    <line x1="105" y1="160" x2="105" y2="310"/>
    <line x1="145" y1="160" x2="145" y2="310"/>
    <line x1="185" y1="160" x2="185" y2="310"/>
    <line x1="65" y1="198" x2="225" y2="198"/>
    <line x1="65" y1="235" x2="225" y2="235"/>
    <line x1="65" y1="272" x2="225" y2="272"/>
  </g>
  <g font-size="16" fill="#7c2d12" font-weight="700" text-anchor="middle">
    <text x="85" y="184">1</text><text x="125" y="184">2</text><text x="165" y="184">3</text><text x="205" y="184">A</text>
    <text x="85" y="221">4</text><text x="125" y="221">5</text><text x="165" y="221">6</text><text x="205" y="221">B</text>
    <text x="85" y="258">7</text><text x="125" y="258">8</text><text x="165" y="258">9</text><text x="205" y="258">C</text>
    <text x="85" y="295">*</text><text x="125" y="295">0</text><text x="165" y="295">#</text><text x="205" y="295">D</text>
  </g>
</g>
<g font-size="12" fill="#7c2d12" font-weight="700">
  <text x="270" y="145">Fila1</text><text x="270" y="165">Fila2</text><text x="270" y="185">Fila3</text><text x="270" y="205">Fila4</text>
  <text x="270" y="225">Col1</text><text x="270" y="245">Col2</text><text x="270" y="265">Col3</text><text x="270" y="285">Col4</text>
</g>
<g stroke="#c2410c" stroke-width="3">
  <line x1="260" y1="140" x2="330" y2="140"/>
  <line x1="260" y1="160" x2="330" y2="160"/>
  <line x1="260" y1="180" x2="330" y2="180"/>
  <line x1="260" y1="200" x2="330" y2="200"/>
  <line x1="260" y1="220" x2="330" y2="220"/>
  <line x1="260" y1="240" x2="330" y2="240"/>
  <line x1="260" y1="260" x2="330" y2="260"/>
  <line x1="260" y1="280" x2="330" y2="280"/>
</g>
<g font-size="12" fill="#334155" text-anchor="end">
  <text x="325" y="136">13</text><text x="325" y="156">14</text><text x="325" y="176">27</text><text x="325" y="196">26</text>
  <text x="325" y="216">25</text><text x="325" y="236">33</text><text x="325" y="256">32</text><text x="325" y="276">15</text>
</g>

<!-- LCD -->
<g>
  <rect x="560" y="130" width="200" height="150" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="660" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">LCD 16x2 I2C</text>
  <text x="660" y="174" text-anchor="middle" font-size="11" fill="#166534">módulo PCF8574, addr 0x27</text>
  <rect x="580" y="190" width="160" height="60" rx="4" fill="#166534"/>
  <text x="660" y="225" text-anchor="middle" font-size="12" fill="#bbf7d0">Hola :)</text>
</g>
<!-- ESP32 side pin labels for LCD -->
<g font-size="12" fill="#334155" text-anchor="start">
  <text x="335" y="356">GPIO21</text>
  <text x="335" y="381">GPIO22</text>
  <text x="335" y="406">VIN</text>
  <text x="335" y="431">GND</text>
</g>

<!-- SDA: ESP32(480,360) right to 500, up to 200, right into LCD -->
<line x1="480" y1="360" x2="500" y2="360" stroke="#eab308" stroke-width="3"/>
<line x1="500" y1="360" x2="500" y2="200" stroke="#eab308" stroke-width="3"/>
<line x1="500" y1="200" x2="560" y2="200" stroke="#eab308" stroke-width="3"/>
<text x="555" y="196" text-anchor="end" font-size="11" fill="#854d0e">SDA</text>

<!-- SCL -->
<line x1="480" y1="385" x2="515" y2="385" stroke="#16a34a" stroke-width="3"/>
<line x1="515" y1="385" x2="515" y2="222" stroke="#16a34a" stroke-width="3"/>
<line x1="515" y1="222" x2="560" y2="222" stroke="#16a34a" stroke-width="3"/>
<text x="555" y="218" text-anchor="end" font-size="11" fill="#15803d">SCL</text>

<!-- VCC / VIN -->
<line x1="480" y1="410" x2="530" y2="410" stroke="#dc2626" stroke-width="3"/>
<line x1="530" y1="410" x2="530" y2="244" stroke="#dc2626" stroke-width="3"/>
<line x1="530" y1="244" x2="560" y2="244" stroke="#dc2626" stroke-width="3"/>
<text x="555" y="240" text-anchor="end" font-size="11" fill="#991b1b">VCC</text>

<!-- GND -->
<line x1="480" y1="435" x2="545" y2="435" stroke="#111827" stroke-width="3"/>
<line x1="545" y1="435" x2="545" y2="266" stroke="#111827" stroke-width="3"/>
<line x1="545" y1="266" x2="560" y2="266" stroke="#111827" stroke-width="3"/>
<text x="555" y="262" text-anchor="end" font-size="11" fill="#111827">GND</text>

<!-- Steps -->
<g font-family="sans-serif" font-size="12.5" fill="#334155">
  <text x="30" y="480">① Las 4 filas y 4 columnas del teclado van directo a los GPIO — sin resistencias.</text>
  <text x="30" y="500">② SDA/SCL de la pantalla al mismo bus I2C (GPIO21/22).</text>
  <text x="30" y="520">③ La pantalla se alimenta de VIN (5V), no de 3V3, o el fondo queda muy tenue.</text>
</g>

<rect x="30" y="540" width="740" height="30" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="400" y="560" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">Ningún componente de esta placa necesita fuente externa: alcanza con el cargador USB.</text>
</svg>
