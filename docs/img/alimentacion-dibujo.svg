<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Cómo alimentar todo: cargadores + fuente vieja de PC</title>
<rect x="0" y="0" width="800" height="760" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#111">Así se alimenta todo</text>
<text x="400" y="62" text-anchor="middle" font-size="14" fill="#555">Cargadores de celular para los ESP32 + fuente vieja de PC (6V / 9V / 12V) para servo y motor</text>

<!-- Leyenda -->
<g font-family="sans-serif" font-size="13">
  <rect x="30" y="80" width="740" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="45" y1="100" x2="80" y2="100" stroke="#dc2626" stroke-width="5"/>
  <text x="88" y="105" fill="#334155">rojo = + (V+)</text>
  <line x1="220" y1="100" x2="255" y2="100" stroke="#111827" stroke-width="5"/>
  <text x="263" y="105" fill="#334155">negro = GND</text>
  <line x1="400" y1="100" x2="435" y2="100" stroke="#7c3e10" stroke-width="5"/>
  <text x="443" y="105" fill="#334155">marrón = GND del servo</text>
  <line x1="620" y1="100" x2="655" y2="100" stroke="#ea580c" stroke-width="5"/>
  <text x="663" y="105" fill="#334155">señal</text>
</g>

<!-- Cargador 1 -->
<g>
  <rect x="30" y="160" width="150" height="70" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="105" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Cargador</text>
  <text x="105" y="210" text-anchor="middle" font-size="13" fill="#1e40af">celular #1 (5V)</text>
  <text x="105" y="245" text-anchor="middle" font-size="12" fill="#64748b">① cable USB</text>
</g>
<line x1="180" y1="195" x2="260" y2="195" stroke="#1d4ed8" stroke-width="4"/>
<rect x="260" y="150" width="160" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="340" y="185" text-anchor="middle" font-size="16" font-weight="800" fill="#111">ESP32 #2</text>
<text x="340" y="205" text-anchor="middle" font-size="13" fill="#64748b">sorter</text>
<text x="340" y="225" text-anchor="middle" font-size="11" fill="#94a3b8">se alimenta por su propio cable USB</text>

<!-- Cargador 2 -->
<g>
  <rect x="610" y="160" width="150" height="70" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="685" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Cargador</text>
  <text x="685" y="210" text-anchor="middle" font-size="13" fill="#1e40af">celular #2 (5V)</text>
  <text x="685" y="245" text-anchor="middle" font-size="12" fill="#64748b">① cable USB</text>
</g>
<line x1="610" y1="195" x2="530" y2="195" stroke="#1d4ed8" stroke-width="4"/>
<rect x="370" y="150" width="160" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" opacity="0"/>
<rect x="530" y="150" width="160" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="610" y="185" text-anchor="middle" font-size="16" font-weight="800" fill="#111">ESP32 #1</text>
<text x="610" y="205" text-anchor="middle" font-size="13" fill="#64748b">gateway</text>
<text x="610" y="225" text-anchor="middle" font-size="11" fill="#94a3b8">se alimenta por su propio cable USB</text>

<!-- Fuente vieja -->
<g>
  <rect x="230" y="330" width="340" height="160" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/>
  <text x="400" y="358" text-anchor="middle" font-size="16" font-weight="800" fill="#713f12">Fuente vieja de PC</text>
  <text x="400" y="377" text-anchor="middle" font-size="12" fill="#854d0e">③ medí cada salida con el multímetro antes de conectar nada</text>

  <rect x="250" y="395" width="90" height="50" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="295" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#166534">6V</text>
  <rect x="355" y="395" width="90" height="50" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="400" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">9V</text>
  <rect x="460" y="395" width="90" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="505" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#6b7280">12V</text>
  <text x="505" y="463" text-anchor="middle" font-size="10.5" fill="#78716c">no usar</text>
</g>

<!-- 6V -> Servo -->
<line x1="295" y1="445" x2="295" y2="560" stroke="#dc2626" stroke-width="4"/>
<line x1="295" y1="560" x2="175" y2="560" stroke="#dc2626" stroke-width="4"/>
<text x="200" y="550" font-size="12" fill="#991b1b" font-weight="700">② 6V → servo</text>
<rect x="30" y="530" width="145" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="102" y="558" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Servo SG90</text>
<text x="102" y="576" text-anchor="middle" font-size="12" fill="#9a3412">V+ = rojo</text>
<text x="102" y="592" text-anchor="middle" font-size="12" fill="#9a3412">máx 6V</text>
<line x1="102" y1="620" x2="102" y2="660" stroke="#7c3e10" stroke-width="4"/>

<!-- 9V -> L298N -->
<line x1="400" y1="445" x2="400" y2="560" stroke="#dc2626" stroke-width="4"/>
<line x1="400" y1="560" x2="640" y2="560" stroke="#dc2626" stroke-width="4"/>
<text x="470" y="550" font-size="12" fill="#991b1b" font-weight="700">② 9V → L298N VMS</text>
<rect x="640" y="530" width="130" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="705" y="558" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">L298N</text>
<text x="705" y="576" text-anchor="middle" font-size="12" fill="#991b1b">+ motor</text>
<text x="705" y="592" text-anchor="middle" font-size="12" fill="#991b1b">6-12V ok</text>
<line x1="705" y1="620" x2="705" y2="660" stroke="#111827" stroke-width="4"/>

<!-- GND bus -->
<line x1="102" y1="660" x2="705" y2="660" stroke="#111827" stroke-width="5"/>
<line x1="340" y1="490" x2="340" y2="660" stroke="#111827" stroke-width="4"/>
<line x1="340" y1="660" x2="340" y2="660" stroke="#111827" stroke-width="4"/>
<line x1="340" y1="240" x2="340" y2="490" stroke="#111827" stroke-width="4" stroke-dasharray="6 4"/>
<text x="400" y="682" text-anchor="middle" font-size="13" font-weight="800" fill="#111">④ GND COMÚN — une fuente, servo, L298N y ambos ESP32</text>
<text x="400" y="700" text-anchor="middle" font-size="11.5" fill="#64748b">(el GND del ESP32 se une acá aunque el ESP32 coma de su propio cargador USB)</text>

<!-- Warning -->
<rect x="30" y="720" width="740" height="30" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="740" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">⚠ El SG90 aguanta hasta 6V. Nunca lo conectes a la salida de 9V ni 12V — se quema.</text>
</svg>
