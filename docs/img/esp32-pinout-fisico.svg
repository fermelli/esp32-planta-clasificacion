<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ESP32 DevKit (30 pines) - pinout fisico real</title>
  <g>
<rect x="0" y="0" width="760" height="700" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111">ESP32 DevKit (30 pines) - pinout fisico real</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#555">Vista desde arriba, USB hacia arriba. Referencia comun a los dos ESP32 del proyecto.</text>
