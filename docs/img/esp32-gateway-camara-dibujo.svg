<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Cámara de rostro junto al gateway</title>
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="430.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Cámara de rostro junto al gateway</text>
  <defs></defs>
  <text x="430.0" y="52" text-anchor="middle" font-size="13" fill="#555">Sin cables entre las dos placas: cada una con su USB de 5 V, y por WiFi con la laptop</text>
  <rect x="330" y="72" width="200" height="46" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="430" y="93" text-anchor="middle" font-size="12.5" fill="#0369a1" font-weight="600">Hotspot del celular</text>
  <text x="430" y="109" text-anchor="middle" font-size="10.5" fill="#0369a1">2.4 GHz</text>
  <rect x="40" y="150" width="300" height="240" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="190" y="176" text-anchor="middle" font-size="14" fill="#111" font-weight="700">ESP32 #1 — gateway</text>
  <text x="190" y="194" text-anchor="middle" font-size="10.5" fill="#64748b">teclado + LCD, cableado como antes</text>
  <rect x="65" y="210" width="120" height="80" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="125" y="255" text-anchor="middle" font-size="11" fill="#7c2d12" font-weight="600">teclado 4x4</text>
  <rect x="200" y="210" width="110" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="255" y="255" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">LCD 16x2</text>
  <text x="190" y="322" text-anchor="middle" font-size="11" fill="#334155">pines del gateway que usa la cámara:</text>
  <text x="190" y="340" text-anchor="middle" font-size="13" fill="#a16207" font-weight="700">ninguno</text>
  <rect x="165" y="390" width="50" height="14" rx="2" fill="#334155"/>
  <line x1="190" y1="404" x2="190" y2="440" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="440" width="160" height="40" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="190.0" y="457.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">Cargador USB</text>
  <text x="190.0" y="471.0" text-anchor="middle" font-size="10.5" fill="#334155">5 V</text>
  <rect x="490" y="150" width="240" height="150" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="610" y="176" text-anchor="middle" font-size="14" fill="#111" font-weight="700">ESP32-S3-CAM</text>
  <text x="610" y="194" text-anchor="middle" font-size="10.5" fill="#a16207">firmware esp32-cam-rostro</text>
  <path d="M610,238 L545.0,415 L675.0,415 Z" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="610" cy="238" r="11" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <circle cx="610" cy="238" r="4.5" fill="#60a5fa"/>
  <rect x="730" y="214" width="12" height="24" rx="2" fill="#334155"/>
  <line x1="742" y1="238" x2="770" y2="238" stroke="#334155" stroke-width="1.5"/>
  <rect x="770" y="214" width="80" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="810.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="600">Cargador</text>
  <text x="810.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#334155">USB 5 V</text>
  <circle cx="610" cy="438" r="15" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <path d="M576,506 q0,-34 34,-34 q34,0 34,34 z" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="526" text-anchor="middle" font-size="10.5" fill="#334155">quien teclea (mira al lente)</text>
  <line x1="340" y1="230" x2="490" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="415" y="220" text-anchor="middle" font-size="10.5" fill="#64748b">sin cables</text>
  <text x="415" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">entre ellas</text>
  <line x1="250" y1="150" x2="350" y2="119" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="610" y1="150" x2="510" y2="119" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="285" y="128" text-anchor="middle" font-size="10.5" fill="#0369a1" paint-order="stroke" stroke="#fff" stroke-width="4">WiFi</text>
  <text x="580" y="128" text-anchor="middle" font-size="10.5" fill="#0369a1" paint-order="stroke" stroke="#fff" stroke-width="4">WiFi</text>
  <text x="40" y="508" text-anchor="start" font-size="11" fill="#334155">① La cámara lleva su propio cargador USB de 5 V (no se alimenta del gateway).</text>
  <text x="40" y="526" text-anchor="start" font-size="11" fill="#334155">② Sin cables entre las dos placas: hablan por WiFi con la laptop.</text>
  <text x="40" y="544" text-anchor="start" font-size="11" fill="#334155">③ Lente hacia la cara de quien teclea, a su altura y con luz de frente.</text>
</svg>
