<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>¿Qué hace el teclado según la cámara?</title>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">¿Qué hace el teclado según la cámara?</text>
  <defs><marker id="a334155" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker></defs>
  <text x="480.0" y="52" text-anchor="middle" font-size="13" fill="#555">El flag activa la versión, pero solo actúa si hay una placa con ese firmware conectada</text>
  <rect x="20" y="120" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="146" text-anchor="middle" font-size="12.5" fill="#111" font-weight="600">PIN correcto</text>
  <text x="95" y="163" text-anchor="middle" font-size="10" fill="#64748b">planta/login/intento</text>
  <line x1="170" y1="150" x2="236" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a334155)"/>
  <path d="M320,102.0 L405.0,150 L320,198.0 L235.0,150 Z" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="320" y="139" text-anchor="middle" font-size="11" fill="#a16207" font-weight="600">¿LOGIN_ROSTRO</text>
  <text x="320" y="153" text-anchor="middle" font-size="11" fill="#a16207" font-weight="600">activado?</text>
  <line x1="405" y1="150" x2="476" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a334155)"/>
  <text x="440" y="140" text-anchor="middle" font-size="11" fill="#334155">sí</text>
  <path d="M570,102.0 L665.0,150 L570,198.0 L475.0,150 Z" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="570" y="139" text-anchor="middle" font-size="11" fill="#a16207" font-weight="600">¿hay cámara de</text>
  <text x="570" y="153" text-anchor="middle" font-size="11" fill="#a16207" font-weight="600">rostro conectada?</text>
  <line x1="665" y1="150" x2="736" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#a334155)"/>
  <text x="700" y="140" text-anchor="middle" font-size="11" fill="#334155">sí</text>
  <rect x="738" y="108" width="200" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="838" y="132" text-anchor="middle" font-size="12.5" fill="#047857" font-weight="600">PIN + rostro</text>
  <text x="838" y="150" text-anchor="middle" font-size="10" fill="#047857">requiere_rostro + orden a la placa</text>
  <text x="838" y="166" text-anchor="middle" font-size="10" fill="#047857">cara coincide → entra</text>
  <text x="838" y="181" text-anchor="middle" font-size="10" fill="#047857">3 rechazos o 15 s → intento fallido</text>
  <line x1="320" y1="198" x2="320" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#a334155)"/>
  <text x="334" y="232" text-anchor="start" font-size="11" fill="#334155">no</text>
  <rect x="215" y="264" width="210" height="66" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#111" font-weight="600">Solo PIN, como siempre</text>
  <text x="320" y="308" text-anchor="middle" font-size="10.5" fill="#64748b">sin cámara de por medio</text>
  <line x1="570" y1="198" x2="570" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#a334155)"/>
  <text x="584" y="232" text-anchor="start" font-size="11" fill="#334155">no</text>
  <rect x="455" y="264" width="230" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="570" y="288" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">Entra solo con PIN</text>
  <text x="570" y="305" text-anchor="middle" font-size="10.5" fill="#b91c1c">y queda una alerta camara_offline</text>
  <text x="570" y="320" text-anchor="middle" font-size="10.5" fill="#b91c1c">(el teclado nunca se bloquea)</text>
  <rect x="30" y="350" width="900" height="34" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#334155">Cómo lo sabe: cada firmware publica planta/camara/estado/&lt;versión&gt; retenido, y el broker publica online:false solo (last will) si la placa se cae.</text>
</svg>
