<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta el servo de la puerta y el botón</title>
<rect x="0" y="0" width="800" height="740" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta: puerta (servo + botón)</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">3 cables del servo + 2 del botón + GND común</text>

<!-- ESP32 -->
<rect x="30" y="100" width="160" height="460" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="110" y="130" text-anchor="middle" font-size="16" font-weight="800">ESP32 #2</text>
<text x="110" y="150" text-anchor="middle" font-size="12" fill="#64748b">sorter</text>
<circle cx="185" cy="200" r="5" fill="#111"/>
<text x="45" y="204" font-size="13" fill="#334155" font-weight="700">GPIO13</text>
<circle cx="185" cy="430" r="5" fill="#111"/>
<text x="45" y="434" font-size="13" fill="#334155" font-weight="700">GPIO4</text>
<circle cx="185" cy="480" r="5" fill="#111"/>
<text x="45" y="484" font-size="13" fill="#334155" font-weight="700">GND</text>

<!-- Servo real -->
<g>
  <rect x="500" y="70" width="70" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="455" y="130" width="20" height="60" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="600" y="130" width="20" height="60" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="470" y="90" width="130" height="140" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="535" y="165" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">SG90</text>
  <text x="535" y="183" text-anchor="middle" font-size="11" fill="#1e40af">servo puerta</text>
  <text x="478" y="196" font-size="11" fill="#334155">Señal</text>
  <text x="505" y="222" text-anchor="middle" font-size="10.5" fill="#991b1b">V+</text>
  <text x="555" y="222" text-anchor="middle" font-size="10.5" fill="#334155">GND</text>
</g>

<!-- ESP32 -> Señal -->
<line x1="190" y1="200" x2="470" y2="200" stroke="#ea580c" stroke-width="4"/>

<!-- Fuente 6V -->
<g>
  <rect x="470" y="270" width="130" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="535" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Fuente 6V</text>
  <text x="535" y="323" text-anchor="middle" font-size="10.5" fill="#166534">(de la vieja de PC)</text>
  <text x="535" y="338" text-anchor="middle" font-size="10" fill="#166534">NO la salida de 12V</text>
</g>

<!-- Fuente V+ -> Servo V+ -->
<line x1="505" y1="270" x2="505" y2="230" stroke="#dc2626" stroke-width="4"/>

<!-- Servo GND -> riel -->
<line x1="555" y1="230" x2="555" y2="250" stroke="#111827" stroke-width="4"/>
<line x1="555" y1="250" x2="650" y2="250" stroke="#111827" stroke-width="4"/>

<!-- Fuente GND -> riel -->
<line x1="600" y1="305" x2="650" y2="305" stroke="#111827" stroke-width="4"/>

<!-- Botón -->
<g>
  <rect x="470" y="390" width="130" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="535" y="406" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">Botón puerta</text>
  <circle cx="535" cy="460" r="22" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
  <text x="478" y="434" font-size="10.5" fill="#78350f">GPIO4</text>
  <text x="592" y="496" text-anchor="end" font-size="10.5" fill="#334155">GND</text>
</g>

<!-- ESP32 -> Botón (GPIO4) -->
<line x1="190" y1="430" x2="470" y2="430" stroke="#7c3aed" stroke-width="4"/>

<!-- Botón GND -> riel -->
<line x1="600" y1="492" x2="650" y2="492" stroke="#111827" stroke-width="4"/>

<!-- GND: riel único a la derecha, vuelve al ESP32 por abajo -->
<line x1="650" y1="250" x2="650" y2="530" stroke="#111827" stroke-width="4"/>
<line x1="650" y1="530" x2="185" y2="530" stroke="#111827" stroke-width="4"/>
<line x1="185" y1="530" x2="185" y2="480" stroke="#111827" stroke-width="4"/>
<circle cx="650" cy="250" r="3.5" fill="#111827"/>
<circle cx="650" cy="305" r="3.5" fill="#111827"/>
<circle cx="650" cy="492" r="3.5" fill="#111827"/>

<text x="400" y="580" text-anchor="middle" font-size="13.5" font-weight="800" fill="#111">GND común: ESP32 + servo + fuente + botón</text>

<!-- Steps -->
<g font-family="sans-serif" font-size="12.5" fill="#334155">
  <text x="60" y="610">① Señal del servo (naranja) → GPIO13</text>
  <text x="60" y="630">② V+ del servo (rojo) → salida de 6V de la fuente</text>
  <text x="60" y="650">③ Botón: una pata → GPIO4, la otra → GND (sin resistencia)</text>
  <text x="60" y="670">④ GND del servo, del botón, de la fuente y del ESP32: todos juntos</text>
</g>

<rect x="30" y="695" width="740" height="30" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="715" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">⚠ El SG90 aguanta máx 6V. Nunca lo alimentes con el pin 5V del ESP32 ni con la salida de 12V.</text>
</svg>
