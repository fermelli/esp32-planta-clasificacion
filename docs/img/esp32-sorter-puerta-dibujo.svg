<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Así se conecta el servo de la puerta y el botón</title>
<rect x="0" y="0" width="800" height="620" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#111">Así se conecta: puerta (servo + botón)</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#555">3 cables del servo + 2 del botón + GND común</text>

<!-- ESP32 -->
<rect x="30" y="120" width="170" height="340" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="115" y="150" text-anchor="middle" font-size="16" font-weight="800">ESP32 #2</text>
<text x="115" y="170" text-anchor="middle" font-size="12" fill="#64748b">sorter</text>
<circle cx="185" cy="230" r="5" fill="#111"/>
<text x="70" y="234" font-size="13" fill="#334155" font-weight="700">GPIO13</text>
<circle cx="185" cy="310" r="5" fill="#111"/>
<text x="75" y="314" font-size="13" fill="#334155" font-weight="700">GPIO4</text>
<circle cx="185" cy="410" r="5" fill="#111"/>
<text x="95" y="414" font-size="13" fill="#334155" font-weight="700">GND</text>

<!-- Servo real -->
<g>
  <rect x="480" y="120" width="110" height="150" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="500" y="80" width="70" height="40" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="470" y="150" width="20" height="60" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="590" y="150" width="20" height="60" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="535" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">SG90</text>
  <text x="535" y="250" text-anchor="middle" font-size="11" fill="#1e40af">servo puerta</text>
</g>
<!-- 3 cables saliendo del servo -->
<line x1="480" y1="150" x2="380" y2="150" stroke="#ea580c" stroke-width="4"/>
<line x1="480" y1="165" x2="380" y2="230" stroke="#dc2626" stroke-width="4"/>
<line x1="480" y1="180" x2="380" y2="410" stroke="#7c3e10" stroke-width="4"/>
<text x="390" y="145" font-size="12" fill="#c2410c" font-weight="700">naranja = Señal</text>
<text x="390" y="285" font-size="12" fill="#991b1b" font-weight="700">rojo = V+</text>
<text x="390" y="440" font-size="12" fill="#7c3e10" font-weight="700">marrón = GND</text>

<!-- Cable señal -> GPIO13 -->
<line x1="380" y1="150" x2="380" y2="230" stroke="#ea580c" stroke-width="4"/>
<line x1="380" y1="230" x2="185" y2="230" stroke="#ea580c" stroke-width="4"/>
<!-- Cable GND servo -> bus GND -->
<line x1="380" y1="410" x2="185" y2="410" stroke="#7c3e10" stroke-width="4"/>
<!-- Cable V+ servo -> fuente 6V -->
<line x1="380" y1="230" x2="380" y2="230" stroke="none"/>
<line x1="380" y1="165" x2="700" y2="165" stroke="#dc2626" stroke-width="4" stroke-dasharray="0"/>

<!-- Fuente 6V -->
<rect x="640" y="120" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="710" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">Fuente 6V</text>
<text x="710" y="170" text-anchor="middle" font-size="12" fill="#166534">(de la vieja de PC)</text>
<text x="710" y="188" text-anchor="middle" font-size="11" fill="#166534">NO la salida de 12V</text>
<line x1="380" y1="165" x2="640" y2="165" stroke="#dc2626" stroke-width="4"/>
<line x1="640" y1="165" x2="640" y2="165" stroke="none"/>
<line x1="700" y1="210" x2="700" y2="410" stroke="#111827" stroke-width="4"/>
<line x1="700" y1="410" x2="380" y2="410" stroke="#111827" stroke-width="4"/>
<line x1="710" y1="165" x2="710" y2="165" stroke="none"/>

<!-- Botón -->
<g>
  <rect x="480" y="340" width="90" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="525" cy="385" r="26" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
  <text x="525" y="460" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">Botón puerta</text>
</g>
<line x1="480" y1="360" x2="380" y2="230" stroke="#7c3aed" stroke-width="4"/>
<text x="390" y="330" font-size="12" fill="#6d28d9" font-weight="700">morado → GPIO4</text>
<line x1="480" y1="410" x2="380" y2="410" stroke="#111827" stroke-width="4"/>

<!-- GND bus vertical uniting -->
<line x1="185" y1="410" x2="185" y2="410" stroke="#111827" stroke-width="4"/>

<!-- Steps -->
<g font-family="sans-serif" font-size="13" fill="#334155">
  <text x="60" y="500">① Señal del servo (naranja) → GPIO13</text>
  <text x="60" y="520">② V+ del servo (rojo) → salida de 6V de la fuente</text>
  <text x="60" y="540">③ Botón: una pata → GPIO4, la otra → GND (sin resistencia)</text>
  <text x="60" y="560">④ GND del servo, del botón, de la fuente y del ESP32: todos juntos</text>
</g>

<rect x="30" y="580" width="740" height="30" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="400" y="600" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">⚠ El SG90 aguanta máx 6V. Nunca lo alimentes con el pin 5V del ESP32 ni con la salida de 12V.</text>
</svg>
