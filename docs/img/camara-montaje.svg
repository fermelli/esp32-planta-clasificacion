<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Montaje de la cámara según la versión</title>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Montaje de la cámara según la versión</text>
  <defs><marker id="a475569" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="ab45309" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b45309"/></marker></defs>
  <text x="480.0" y="52" text-anchor="middle" font-size="13" fill="#555">Vista desde arriba; una sola placa, se cambia de lugar al cambiar de firmware</text>
  <rect x="20" y="72" width="445" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="242" y="96" text-anchor="middle" font-size="13" fill="#64748b">Versión A — rostro</text>
  <rect x="70" y="118" width="200" height="78" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="142" text-anchor="middle" font-size="12" fill="#111" font-weight="600">Gateway (ESP32 #1)</text>
  <rect x="88" y="156" width="96" height="30" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="136" y="176" text-anchor="middle" font-size="10.5" fill="#334155">teclado 4x4</text>
  <rect x="198" y="156" width="62" height="30" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="229" y="176" text-anchor="middle" font-size="10.5" fill="#166534">LCD</text>
  <rect x="300" y="128" width="92" height="62" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="346" y="148" text-anchor="middle" font-size="11" fill="#111" font-weight="600">ESP32-S3-CAM</text>
  <text x="346" y="164" text-anchor="middle" font-size="10" fill="#a16207">fija, junto al</text>
  <text x="346" y="178" text-anchor="middle" font-size="10" fill="#a16207">teclado</text>
  <path d="M346,190 L296,300 L396,300 Z" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="346" cy="322" r="15" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <path d="M312,372 q0,-34 34,-34 q34,0 34,34 z" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="346" y="396" text-anchor="middle" font-size="10.5" fill="#334155">operador (mira al lente)</text>
  <text x="100" y="250" text-anchor="start" font-size="10.5" fill="#64748b">luz de frente,</text>
  <text x="100" y="265" text-anchor="start" font-size="10.5" fill="#64748b">sin contraluz</text>
  <text x="100" y="292" text-anchor="start" font-size="10.5" fill="#64748b">tras teclear el PIN hay</text>
  <text x="100" y="307" text-anchor="start" font-size="10.5" fill="#64748b">unos segundos para mirar</text>
  <rect x="495" y="72" width="445" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="717" y="96" text-anchor="middle" font-size="13" fill="#64748b">Versión B — color</text>
  <rect x="515" y="250" width="405" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="717" y="290" text-anchor="middle" font-size="11" fill="#475569">cinta transportadora</text>
  <line x1="560" y1="312" x2="880" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#a475569)"/>
  <text x="720" y="330" text-anchor="middle" font-size="10.5" fill="#475569">sentido de la cinta</text>
  <rect x="570" y="206" width="62" height="42" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="601" y="224" text-anchor="middle" font-size="10.5" fill="#4338ca" font-weight="600">TCS3472</text>
  <text x="601" y="239" text-anchor="middle" font-size="10" fill="#4338ca">sensor</text>
  <rect x="590" y="256" width="24" height="24" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.2"/>
  <text x="602" y="322" text-anchor="middle" font-size="10" fill="#111"></text>
  <rect x="740" y="118" width="100" height="54" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="790" y="140" text-anchor="middle" font-size="11" fill="#111" font-weight="600">ESP32-S3-CAM</text>
  <text x="790" y="156" text-anchor="middle" font-size="10" fill="#a16207">sobre la cinta</text>
  <path d="M790,172 L742,250 L838,250 Z" fill="#fefce8" stroke="#a16207" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="776" y="256" width="24" height="24" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.2" opacity="0.5"/>
  <line x1="626" y1="268" x2="772" y2="268" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab45309)"/>
  <text x="700" y="262" text-anchor="middle" font-size="10" fill="#b45309" paint-order="stroke" stroke="#fff" stroke-width="4">la caja avanza</text>
  <text x="717" y="360" text-anchor="middle" font-size="10.5" fill="#64748b">apuntar un poco después del sensor: entre que el TCS3472 la ve y</text>
  <text x="717" y="375" text-anchor="middle" font-size="10.5" fill="#64748b">llega la orden a la placa, la cinta ya movió la caja unos centímetros</text>
  <text x="717" y="395" text-anchor="middle" font-size="10.5" fill="#64748b">luz pareja y sin reflejos directos, igual al juntar fotos y al usarlo</text>
  <rect x="20" y="424" width="920" height="30" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="444" text-anchor="middle" font-size="11.5" fill="#334155">La cámara no se cablea a los otros ESP32: solo USB de 5 V (puerto UART para flashear) y WiFi de 2.4 GHz.</text>
</svg>
