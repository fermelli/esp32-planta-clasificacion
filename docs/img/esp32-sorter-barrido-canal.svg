<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Barrido de canal ESP-NOW</title>
  <rect x="0" y="0" width="820" height="210" fill="#ffffff"/>
  <text x="410.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Barrido de canal ESP-NOW</text>
  <text x="410.0" y="52" text-anchor="middle" font-size="13" fill="#555">Cómo el sorter encuentra el canal WiFi del gateway sin conocerlo de antemano</text>
  <g transform="translate(0,70)">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="10" y="35" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="85" y="60" text-anchor="middle" font-size="12" font-family="sans-serif">Fijar canal N</text>
  <text x="85" y="76" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">esp_wifi_set_channel</text>

  <line x1="160" y1="65" x2="228" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="230" y="35" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" font-family="sans-serif">Esperar 400ms</text>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">¿llegó CMD_HELLO?</text>

  <line x1="410" y1="50" x2="470" y2="50" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="440" y="42" text-anchor="middle" font-size="10.5" fill="#15803d" font-family="sans-serif">sí</text>

  <rect x="472" y="20" width="180" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="562" y="45" text-anchor="middle" font-size="12" font-family="sans-serif">Canal fijado</text>
  <text x="562" y="61" text-anchor="middle" font-size="10" fill="#166534" font-family="sans-serif">opera normal</text>

  <line x1="320" y1="95" x2="320" y2="115" stroke="#b45309" stroke-width="1.5"/>
  <line x1="320" y1="115" x2="90" y2="115" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="90" y1="115" x2="90" y2="97" stroke="#b45309" stroke-width="1.5"/>
  <text x="205" y="130" text-anchor="middle" font-size="10.5" fill="#b45309" font-family="sans-serif">no — siguiente canal (1..13)</text>
</g>
</svg>
